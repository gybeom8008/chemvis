<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="AI가 짧은 대본만 쓰면 화학 반응과 물질 현상을 원자·전자 수준으로 그려 주는 웹앱" />
    <title>chemvis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='n'%3E%3Cstop offset='.35' stop-color='%232f7df6' stop-opacity='.55'/%3E%3Cstop offset='1' stop-color='%232f7df6' stop-opacity='0'/%3E%3C/radialGradient%3E%3CradialGradient id='p'%3E%3Cstop offset='.35' stop-color='%23ff4b3e' stop-opacity='.5'/%3E%3Cstop offset='1' stop-color='%23ff4b3e' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='11' fill='url(%23n)'/%3E%3Ccircle cx='6.5' cy='24' r='7' fill='url(%23p)'/%3E%3Ccircle cx='25.5' cy='24' r='7' fill='url(%23p)'/%3E%3Cpath d='M13.2 14.8 8.2 21.6M18.8 14.8 23.8 21.6' stroke='%23464e60' stroke-opacity='.32' stroke-width='5' stroke-linecap='round'/%3E%3Cg fill='%2317233a'%3E%3Ccircle cx='11.7' cy='19.1' r='1.2'/%3E%3Ccircle cx='9.6' cy='17.5' r='1.2'/%3E%3Ccircle cx='20.3' cy='19.1' r='1.2'/%3E%3Ccircle cx='22.4' cy='17.5' r='1.2'/%3E%3C/g%3E%3Cg fill='%23fdfdfb' stroke='%232b3140'%3E%3Ccircle cx='16' cy='11' r='5.6' stroke-width='1.6'/%3E%3Ccircle cx='6.5' cy='24' r='3.6' stroke-width='1.4'/%3E%3Ccircle cx='25.5' cy='24' r='3.6' stroke-width='1.4'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- The titles above the stage, in a serif, as in a book; everything else is in Pretendard. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&amp;display=swap" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="logo">chemvis</span></div>
      <nav class="tabs" role="tablist" aria-label="화면">
        <button role="tab" id="btn-tutorial" data-tab="learn" aria-selected="false">학습</button>
        <button role="tab" data-tab="demo" aria-selected="true">시연</button>
        <button role="tab" data-tab="lab" aria-selected="false">실험실</button>
      </nav>
      <div class="tools">
        <div class="pop-wrap">
          <button class="icon" id="btn-examples" aria-label="예시" title="예시" aria-expanded="false"></button>
          <div class="popover examples" id="examples-pop" hidden></div>
        </div>
        <span class="tools-sep" aria-hidden="true"></span>
        <button class="icon" id="btn-script" aria-label="대본" title="대본" aria-pressed="false"></button>
        <div class="pop-wrap">
          <button class="icon" id="btn-view" aria-label="보기 설정" title="보기 설정" aria-expanded="false"></button>
          <div class="popover" id="view-pop" hidden></div>
        </div>
        <button class="icon" id="btn-link" aria-label="링크 복사" title="링크 복사"></button>
      </div>
    </header>

    <main class="lab" id="lab" role="tabpanel" aria-label="실험실" hidden>
      <div class="lab-empty">
        <p class="lab-name">실험실</p>
        <p>재료를 넣고 반응을 직접 일으켜 보는 곳이에요. 지금 만들고 있어요.</p>
      </div>
    </main>

    <!--
      학습 and 시연 are one screen: the title, the scene with its captions, and the script beside it.
      학습 adds the list of lessons on the left (docs/plan/README.md).
    -->
    <main class="work" id="work" role="tabpanel" aria-label="시연">
      <nav class="tut-nav" id="tut-nav" aria-label="학습 목록"></nav>
      <section class="tut-main" tabindex="-1">
        <header class="tut-head">
          <button class="icon" id="tut-menu" aria-label="목록" title="목록" aria-expanded="false"></button>
          <div class="tut-heading">
            <p class="tut-part" id="tut-part"></p>
            <h2 class="tut-title" id="tut-title"></h2>
          </div>
        </header>
        <div class="viewer-host" id="main-viewer"></div>
      </section>
      <aside class="drawer" id="drawer" aria-label="대본" hidden>
        <div class="drawer-head">
          <span class="drawer-title">대본</span>
          <div class="drawer-tools">
            <button class="icon sm" id="btn-edit" aria-label="고치기" title="고치기"></button>
            <button class="icon sm" id="btn-drawer-close" aria-label="닫기" title="닫기"></button>
          </div>
        </div>
        <div class="code" id="code-view"></div>
        <textarea class="code-edit" id="code-edit" spellcheck="false" hidden></textarea>
        <p class="tryit" id="tryit" hidden></p>
        <ul class="diags" id="diags"></ul>
      </aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
