<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="AI가 짧은 대본만 쓰면 화학 반응과 물질 현상을 원자·전자 수준으로 그려 주는 웹앱" />
    <title>chemvis</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='17' r='8' fill='%23e03131'/%3E%3Ccircle cx='24' cy='9' r='4.5' fill='%23eee' stroke='%23999'/%3E%3Ccircle cx='24' cy='25' r='4.5' fill='%23eee' stroke='%23999'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span class="logo">chemvis</span><span class="scene-title" id="scene-title"></span></div>
      <div class="tools">
        <button class="icon" id="btn-tutorial" aria-label="튜토리얼" title="튜토리얼"></button>
        <div class="pop-wrap">
          <button class="icon" id="btn-examples" aria-label="예시" title="예시" aria-expanded="false"></button>
          <div class="popover examples" id="examples-pop" hidden></div>
        </div>
        <span class="tools-sep" aria-hidden="true"></span>
        <button class="icon" id="btn-script" aria-label="대본" title="대본" aria-pressed="false"></button>
        <div class="pop-wrap">
          <button class="icon" id="btn-view" aria-label="보기 설정" title="보기 설정" aria-expanded="false"></button>
          <div class="popover" id="view-pop" hidden></div>
        </div>
        <button class="icon" id="btn-link" aria-label="링크 복사" title="링크 복사"></button>
      </div>
    </header>

    <main class="work">
      <div class="viewer-host" id="main-viewer"></div>
      <aside class="drawer" id="drawer" aria-label="대본" hidden>
        <div class="drawer-head">
          <span class="drawer-title">대본</span>
          <div class="drawer-tools">
            <button class="icon sm" id="btn-edit" aria-label="고치기" title="고치기"></button>
            <button class="icon sm" id="btn-drawer-close" aria-label="닫기" title="닫기"></button>
          </div>
        </div>
        <div class="code" id="code-view"></div>
        <textarea class="code-edit" id="code-edit" spellcheck="false" hidden></textarea>
        <ul class="diags" id="diags"></ul>
      </aside>
    </main>

    <dialog class="tut" id="tutorial" aria-label="튜토리얼">
      <div class="tut-shell">
        <nav class="tut-nav" id="tut-nav"></nav>
        <section class="tut-main" tabindex="-1" autofocus>
          <header class="tut-head">
            <div class="tut-heading">
              <p class="tut-part" id="tut-part"></p>
              <h2 class="tut-title" id="tut-title"></h2>
            </div>
            <div class="tut-tools">
              <div class="pop-wrap">
                <button class="icon" id="tut-view" aria-label="보기 설정" title="보기 설정" aria-expanded="false"></button>
                <div class="popover" id="tut-view-pop" hidden></div>
              </div>
              <button class="icon" id="tut-script" aria-label="대본" title="대본" aria-pressed="false"></button>
              <button class="icon" id="tut-open" aria-label="작업 공간에서 고쳐 보기" title="작업 공간에서 고쳐 보기"></button>
              <button class="icon" id="tut-close" aria-label="닫기" title="닫기 (Esc)"></button>
            </div>
          </header>
          <div class="tut-intro" id="tut-intro"></div>
          <div class="tut-body">
            <div class="viewer-host" id="tut-viewer"></div>
            <aside class="tut-code" id="tut-code" hidden>
              <div class="code" id="tut-code-view"></div>
              <p class="tryit" id="tut-tryit"></p>
            </aside>
          </div>
        </section>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
