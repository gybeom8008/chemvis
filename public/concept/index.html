<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>chemvis 화면 시안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* 시안: 실제 앱에 연결되지 않은 화면 구성 견본. 무대 이미지는 지금 앱에서 찍은 정지 화면이다. */
:root {
  --bg: #f4f3ef; --surface: #fff; --surface-2: #f5f4f0; --hover: rgba(24,25,27,.06);
  --ink: #18191b; --ink-2: #4a4e55; --muted: #8b9098; --line: #e5e3dc; --track: #e9e7e0;
  --water: #e8f2f8;
  --t-xs: 12px; --t-s: 14px; --t-m: 16px; --t-l: 18px;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: var(--t-s); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.ico { display: block; }

.app { height: 100dvh; display: grid; position: relative; overflow: hidden; background: var(--surface);
  grid-template-rows: 48px minmax(0, 1fr) auto 56px calc(54px + env(safe-area-inset-bottom));
  grid-template-areas: 'top' 'stage' 'say' 'act' 'tabs'; }

/* 위 줄: 지금 어디인가 */
.top { grid-area: top; display: flex; align-items: center; padding: 0 4px; position: relative; min-width: 0; }
.ctx { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 0 4px; }
.ctx .no { font-size: var(--t-xs); color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.ctx h1 { font-size: var(--t-m); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx.conds { align-items: center; gap: 6px; }
.count { font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px; flex: none; }
.segs { position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; display: flex; gap: 3px; }
.segs i { flex: 1; background: var(--track); border-radius: 2px; }
.segs i.on { background: var(--ink); }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); flex: none; }
.ib:hover { background: var(--hover); }
.ib[disabled] { opacity: .28; pointer-events: none; }

/* 무대 */
.stage { grid-area: stage; position: relative; background: var(--water); overflow: hidden; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.legend { position: absolute; left: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.14); display: grid; place-items: center; color: var(--ink-2); }
.tgt { position: absolute; border-radius: 50%; border: 2px dashed var(--ink); transform: translate(-50%, -50%); animation: pulse 1.5s ease-in-out infinite; pointer-events: none; }
.tgt.on { border-style: solid; border-width: 3px; animation: none; }
.tgt.dim { opacity: .25; animation: none; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.12); opacity: .55; } }
.tcard { position: absolute; left: 12px; right: 12px; bottom: 10px; max-width: 420px; margin: 0 auto; background: var(--surface); border-radius: 14px; box-shadow: 0 4px 22px rgba(0,0,0,.16); padding: 12px 14px; font-size: var(--t-s); line-height: 1.5; }
.tcard b { font-size: var(--t-m); }
.tcard p { color: var(--ink-2); margin: 2px 0 8px; word-break: keep-all; }
.tcard .go { font-weight: 650; display: inline-flex; align-items: center; gap: 2px; height: 32px; }

/* 설명 줄: 지금 무슨 일이 일어나는가 (높이 고정, 세 줄) */
.say { grid-area: say; height: 94px; padding: 12px 16px 0; overflow: hidden; }
.tagrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 20px; margin-bottom: 2px; }
.tag { font-size: var(--t-xs); font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.tag.strong { color: var(--ink); font-size: 13px; }
.cap { font-size: var(--t-m); line-height: 1.5; word-break: keep-all; }
.cap.q { font-weight: 650; }
.hint { font-size: var(--t-xs); color: var(--muted); margin-top: 4px; }
.term { border-bottom: 1.5px dotted var(--muted); line-height: 1.2; }
.toks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tok { height: 28px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.tok small { color: var(--muted); font-weight: 600; font-size: 12px; }
.more { font-size: 13px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; height: 28px; }

/* 조작 줄: 지금 무엇을 할 수 있는가 (주 버튼은 하나, 오른쪽) */
.act { grid-area: act; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 8px; }
.btn { height: 44px; padding: 0 12px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-s); font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: #fff; margin-left: auto; padding: 0 14px 0 20px; min-width: 116px; justify-content: center; }
.btn.primary.solo { padding: 0 20px; }

/* 탭 */
.tabs { grid-area: tabs; display: flex; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 550; color: var(--muted); }
.tabs button[aria-current='page'] { color: var(--ink); font-weight: 700; }
.tabs .logo, .tabs .note { display: none; }

/* 서랍: 폰에서는 아래에서 올라오고, PC에서는 오른쪽에 늘 보인다 */
.scrim { position: absolute; inset: 0; background: rgba(20,20,20,.3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 80%; background: var(--surface); border-radius: 18px 18px 0 0; transform: translateY(103%); transition: transform .22s ease; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.14); z-index: 5; }
.app.open .sheet { transform: none; }
.app.open .scrim { opacity: 1; pointer-events: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 6px 14px; }
.sheet-body { overflow: auto; padding: 4px 12px 20px; flex: 1; }
.seg { display: inline-flex; background: var(--track); border-radius: 11px; padding: 3px; }
.seg button { height: 34px; padding: 0 14px; border-radius: 8px; font-size: var(--t-s); font-weight: 650; color: var(--ink-2); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.unit { display: flex; align-items: center; height: 48px; padding: 0 8px; gap: 10px; border-radius: 10px; width: 100%; text-align: left; }
.unit .n { width: 16px; color: var(--muted); font-weight: 650; font-variant-numeric: tabular-nums; }
.unit .t { flex: 1; font-weight: 650; }
.unit .p { font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson { display: flex; align-items: center; min-height: 44px; padding: 0 10px 0 34px; gap: 8px; border-radius: 10px; color: var(--ink-2); width: 100%; text-align: left; }
.lesson .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 28px; flex: none; font-size: 13px; }
.lesson.cur { background: var(--surface-2); color: var(--ink); font-weight: 650; }
.lesson .ck { margin-left: auto; color: var(--muted); }
.gl { font-size: var(--t-xs); color: var(--muted); font-weight: 650; margin: 16px 4px 8px; }
.gl:first-child { margin-top: 6px; }
.pt { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-width: 340px; margin: 0 auto; }
.pt .g { font-size: 10px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.el { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.el.off { background: none !important; color: #c9c7c0 !important; border: 1px dashed #d6d4cc; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
.chip.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip i { font-style: normal; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 11px; display: grid; place-items: center; }
.row { display: flex; align-items: center; min-height: 48px; padding: 6px 10px; border-radius: 10px; gap: 10px; width: 100%; text-align: left; }
.row.cur { background: var(--surface-2); font-weight: 650; }
.row small { color: var(--muted); font-size: var(--t-xs); margin-left: auto; flex: none; }
.gloss { padding: 10px 10px; border-radius: 10px; }
.gloss b { display: block; }
.gloss span { color: var(--ink-2); font-size: 13px; line-height: 1.5; }
pre.code { font-family: var(--mono); font-size: 12px; line-height: 1.65; background: var(--surface-2); border-radius: 12px; padding: 12px; overflow: auto; white-space: pre; color: var(--ink-2); }

/* PC: 탭은 왼쪽, 서랍은 오른쪽에 늘 */
@media (min-width: 900px) {
  .app { grid-template-columns: 78px minmax(0, 1fr) 340px; grid-template-rows: 54px minmax(0, 1fr) auto 68px;
    grid-template-areas: 'tabs top sheet' 'tabs stage sheet' 'tabs say sheet' 'tabs act sheet'; }
  .top { padding: 0 8px 0 16px; }
  .ctx h1 { font-size: 17px; }
  .segs { left: 20px; right: 20px; }
  .tabs { flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 10px 7px; gap: 4px; }
  .tabs button { flex: none; height: 62px; border-radius: 12px; font-size: 12px; }
  .tabs button:hover { background: var(--hover); }
  .tabs .logo { display: block; font-weight: 800; font-size: 13px; letter-spacing: -.02em; text-align: center; padding: 6px 0 12px; }
  .tabs .note { display: block; margin-top: auto; font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 6px; }
  .sheet { position: static; transform: none; height: auto; grid-area: sheet; border-radius: 0; box-shadow: none; border-left: 1px solid var(--line); min-height: 0; }
  .scrim, .sheet-btn, .sheet .x { display: none; }
  .sheet-head { padding: 10px 14px 6px; }
  .say { height: 88px; padding: 16px 24px 0; text-align: center; }
  .cap { max-width: 640px; margin: 0 auto; font-size: 17px; }
  .toks { justify-content: center; }
  .tagrow { justify-content: center; }
  .act { justify-content: center; gap: 8px; }
  .btn.primary { margin-left: 0; }
  .legend { left: 14px; bottom: 14px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="ib sheet-btn" id="sheet-btn"></button>
    <div class="ctx" id="ctx"></div>
    <span class="count" id="count"></span>
    <div id="tools" style="display:flex"></div>
    <div class="segs" id="segs"></div>
  </header>
  <section class="stage" id="stage">
    <img id="shot" alt="" />
    <div id="over"></div>
    <button class="legend" aria-label="범례" title="범례" id="legend"></button>
  </section>
  <section class="say" id="say" aria-live="polite"></section>
  <footer class="act" id="act"></footer>
  <nav class="tabs" id="tabs"></nav>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet">
    <div class="sheet-head"><div class="seg" id="seg"></div><button class="ib x" id="sheet-x" aria-label="접기" title="접기"></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
</div>
<script>
const P = {
  book: '<path d="M3 4.5h5.5A3.5 3.5 0 0 1 12 8v12a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 4.5h-5.5A3.5 3.5 0 0 0 12 8v12a2.5 2.5 0 0 1 2.5-2.5H21z"/>',
  flask: '<path d="M9 3h6"/><path d="M10 3v6.3L4.7 18.4A1.7 1.7 0 0 0 6.2 21h11.6a1.7 1.7 0 0 0 1.5-2.6L14 9.3V3"/><path d="M7.6 14.5h8.8"/>',
  spark: '<path d="m11 4 1.8 4.9 4.9 1.8-4.9 1.8L11 17.4l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="m18.5 15 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
  list: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/>',
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><path d="M17 14v6M14 17h6"/>',
  layers: '<path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>',
  sliders: '<path d="M4 7h8.5M17.5 7H20M4 17h2.5M11.5 17H20"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/>',
  link: '<path d="M10 13.5a4.5 4.5 0 0 0 6.8.5l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.6 1.6"/><path d="M14 10.5a4.5 4.5 0 0 0-6.8-.5l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.6-1.6"/>',
  legend: '<circle cx="5.5" cy="7" r="2" fill="currentColor" stroke="none"/><path d="M10 7h10"/><path d="M3.5 12h4"/><path d="M10 12h10"/><path d="M3.5 17 5.5 15l2 2"/><path d="M10 17h10"/>',
  prev: '<path d="m14.5 6-6 6 6 6"/>', next: '<path d="m9.5 6 6 6-6 6"/>',
  replay: '<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v4.5H8"/>',
  trash: '<path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="m6.5 7 .8 12a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.8-12"/>', undo: '<path d="M4.5 9H14a5.5 5.5 0 0 1 0 11H9"/><path d="m8.5 5-4 4 4 4"/>',
  close: '<path d="M18 6 6 18M6 6l12 12"/>', check: '<path d="M20 6.5 9.5 17 4 11.5"/>', down: '<path d="m6 9.5 6 6 6-6"/>',
};
const I = (n, s = 22) => `<svg class="ico" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const $ = (s) => document.querySelector(s);
const wide = () => matchMedia('(min-width: 900px)').matches;

const TABS = [['learn', 'book', '배우기'], ['lab', 'flask', '실험실'], ['ai', 'spark', 'AI 장면']];
const SHEET_ICON = { learn: ['list', '목차'], lab: ['grid', '재료'], ai: ['layers', '장면 목록'] };
const SEGS = { learn: ['수업', '용어'], lab: ['원소', '물질'], ai: ['예시', '내 장면', '대본'] };
const play = (next, label = '다음', prevTo = null) => [
  { k: 'ib', icon: 'prev', label: '이전', go: prevTo, off: prevTo === null },
  { k: 'ghost', icon: 'replay', label: '다시 보기' },
  { k: 'primary', label, icon: 'next', go: next },
];
const H = { p: [227, 213, 11], d: [544, 265, 26] }, CL = { p: [270, 213, 18], d: [648, 265, 43] };

const SCREENS = {
  learn: [
    { img: 'learn-q', n: [1, 3], cap: '물 분자가 HCl에 다가가요. 이때 O의 <button class="term" data-term="lp">비공유 전자쌍</button>은 HCl의 H 쪽을 향해 있어요.', act: play(1) },
    { img: 'learn-q', n: [1, 3], tag: '예측', q: 'H와 Cl을 잇던 전자쌍은 어느 원자로 갈까요?', hint: '무대에서 원자를 눌러 답해요', targets: [['H', H], ['Cl', CL]],
      act: [{ k: 'ib', icon: 'prev', label: '이전', go: 0 }, { k: 'ghost', label: '모르겠어요', go: 2, pick: '?' }] },
    { img: 'learn-q', n: [1, 3], answer: true, targets: [['H', H], ['Cl', CL]],
      act: [{ k: 'ib', icon: 'prev', label: '이전', go: 1 }, { k: 'primary', label: '확인하기', icon: 'next', go: 3 }] },
    { img: 'learn-a', n: [2, 3], cap: 'O의 전자쌍은 새 O–H 결합이 되고, H–Cl 결합의 전자쌍은 Cl로 옮겨 가요.', act: play(4, '다음', 0) },
    { img: 'learn-e', n: [3, 3], cap: '이렇게 해서 <button class="term" data-term="h3o">하이드로늄 이온</button>(H₃O⁺)과 염화 이온(Cl⁻)이 생기고, 둘레의 물 분자가 두 이온을 둘러싸요.', act: play(5, '정리', 3) },
    { img: 'learn-e', n: [3, 3], tag: '정리', q: '산은 물에 녹아 H⁺를 내주는 물질이에요.', toks: ['산', '하이드로늄 이온', '이온화'],
      act: [{ k: 'ib', icon: 'prev', label: '이전', go: 4 }, { k: 'ghost', icon: 'flask', label: '직접 해 보기', tab: 'lab' }, { k: 'primary', label: '다음 수업', icon: 'next', go: 0 }] },
  ],
  lab: [
    { img: 'lab-0', inv: [['Zn', 1], ['Cu²⁺', 1]], hint: '재료를 더 넣거나 반응시켜 보세요',
      act: [{ k: 'ib', icon: 'undo', label: '실행 취소', off: true }, { k: 'ghost', icon: 'trash', label: '비우기' }, { k: 'primary', label: '반응', icon: 'next', go: 1 }] },
    { img: 'lab-1', n: [2, 2], cap: '아연 원자의 바깥 전자 두 개가 구리 이온으로 옮겨 가요.', act: play(2, '다음', 0) },
    { img: 'lab-2', n: [2, 2], tag: '반응했어요', cap: '아연은 전자를 잃고 Zn²⁺가 됐고, 구리 이온은 전자를 얻어 구리 원자가 됐어요.', more: '수업 7-1 산화와 환원', act: play(3, '계속 실험', 1) },
    { img: 'lab-2', inv: [['Zn²⁺', 1], ['Cu', 1]], hint: '재료를 더 넣거나 반응시켜 보세요',
      act: [{ k: 'ib', icon: 'undo', label: '실행 취소', go: 0 }, { k: 'ghost', icon: 'trash', label: '비우기' }, { k: 'primary', label: '반응', icon: 'next', go: 4 }] },
    { img: 'lab-2', tag: '반응하지 않아요', cap: '구리는 아연보다 전자를 내주기 어려운 금속이에요. 그래서 Cu는 Zn²⁺에 전자를 주지 않아요.', more: '수업 7-3 금속의 반응성',
      act: [{ k: 'ib', icon: 'undo', label: '실행 취소', go: 0 }, { k: 'ghost', icon: 'trash', label: '비우기' }, { k: 'primary', label: '반응', icon: 'next', go: 4 }] },
  ],
  ai: [
    { img: 'ai', n: [3, 8], cap: 'O의 <button class="term" data-term="lp">전자쌍</button>은 새 O–C 결합이 되고, C=O 결합 하나의 전자쌍은 O로 옮겨 가요.', act: play(0, '다음', 0) },
  ],
};
const TERMS = {
  lp: ['비공유 전자쌍', '결합에 쓰이지 않고 한 원자에만 속한 전자 두 개예요. 화면에서는 원자 옆의 점 두 개예요.', '수업 3-3 구조식 읽기'],
  h3o: ['하이드로늄 이온', '물 분자가 H⁺ 하나를 얻어서 된 이온(H₃O⁺)이에요.', '수업 6-1 산'],
};
const TITLE = { learn: ['6-1', '산: H⁺를 내주는 물질'], ai: ['', '석회 동굴이 생길 때'] };

const st = { tab: 'learn', i: { learn: 0, lab: 0, ai: 0 }, seg: { learn: 0, lab: 0, ai: 0 }, open: false, pick: null, term: null };

function sheetBody() {
  const t = st.tab, s = st.seg[t];
  if (t === 'learn' && s === 0) {
    const units = [['1', '물질과 입자', '7/7'], ['2', '원자와 전자', '5/5'], ['3', '화학 결합', '9/9'], ['4', '용액', '7/7'], ['5', '화학 반응', '6/6'], ['6', '산과 염기', '0/5', [['6-1', '산: H⁺를 내주는 물질', 1], ['6-2', '염기: H⁺를 얻는 물질'], ['6-3', '강한 산과 약한 산'], ['6-4', '중화 반응'], ['6-5', 'pH']]], ['7', '산화와 환원', '0/5'], ['8', '탄소 화합물', '0/7']];
    return units.map(([n, t2, p, ls]) => `<button class="unit"><span class="n">${n}</span><span class="t">${t2}</span><span class="p">${p}</span>${p.split('/')[0] === p.split('/')[1] ? I('check', 18) : ''}</button>` +
      (ls ? ls.map(([a, b, c]) => `<button class="lesson${c ? ' cur' : ''}"><span class="n">${a}</span>${b}</button>`).join('') : '')).join('');
  }
  if (t === 'learn') return [['산', '물에 녹아 H⁺를 내주는 물질', '6-1'], ['비공유 전자쌍', '결합에 쓰이지 않고 한 원자에만 속한 전자 두 개', '3-3'], ['이온', '전자를 잃거나 얻어서 전하를 띤 원자나 원자단', '2-5'], ['전기 음성도', '결합한 원자가 전자쌍을 자기 쪽으로 당기는 세기', '3-5'], ['하이드로늄 이온', '물 분자가 H⁺ 하나를 얻어서 된 이온(H₃O⁺)', '6-1']]
    .map(([w, m, l]) => `<div class="gloss"><b>${w}</b><span>${m} · 수업 ${l}</span></div>`).join('');
  if (t === 'lab' && s === 0) {
    const C = { H: ['#f4f4f4', '#333'], He: ['#bfecec', '#333'], Li: ['#c58cf0'], C: ['#5f6368'], N: ['#3b5bdb'], O: ['#e03131'], F: ['#74b816'], Ne: ['#9fd8e8', '#333'], Na: ['#9b5de5'], Mg: ['#66a80f'], Al: ['#a79c9c'], Si: ['#d4a373', '#222'], P: ['#f08c00'], S: ['#e6c700', '#222'], Cl: ['#2f9e44'], Ar: ['#8ecae6', '#333'], K: ['#7e3fbf'], Ca: ['#37b24d'], Br: ['#a12b2b'], Fe: ['#b5651d'], Cu: ['#c88033'], Zn: ['#7d80b0'], Ag: ['#b8b8b8', '#222'] };
    const rows = [['H', '', '', '', '', '', '', 'He'], ['Li', 'Be', 'B', 'C', 'N', 'O', 'F', 'Ne'], ['Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Ar'], ['K', 'Ca', 'Ga', 'Ge', 'As', 'Se', 'Br', 'Kr']];
    const cell = (e) => !e ? '<span></span>' : C[e] ? `<button class="el" style="background:${C[e][0]};color:${C[e][1] || '#fff'}${e === 'H' ? ';box-shadow:inset 0 0 0 1px #bbb' : ''}">${e}</button>` : `<span class="el off">${e}</span>`;
    return `<p class="gl">주기율표에서 눌러 넣어요</p><div class="pt">${['1', '2', '13', '14', '15', '16', '17', '18'].map((g) => `<span class="g">${g}</span>`).join('')}${rows.flat().map(cell).join('')}</div>
      <p class="gl">금속</p><div class="pt">${['Fe', 'Cu', 'Zn', 'Ag'].map(cell).join('')}</div>`;
  }
  if (t === 'lab') {
    const g = (title, xs) => `<p class="gl">${title}</p><div class="chips">${xs.map((x) => `<button class="chip">${x.replace(/\*(\d)/, '<i>$1</i>')}</button>`).join('')}</div>`;
    return g('분자', ['H₂O', 'HCl', 'NH₃', 'CO₂', 'CH₄', 'O₂', 'H₂', 'Cl₂', 'CH₃COOH']) + g('이온', ['Na⁺', 'K⁺', 'Ca²⁺', 'Cu²⁺ *1', 'Ag⁺', 'H₃O⁺', 'OH⁻', 'Cl⁻', 'NO₃⁻', 'CO₃²⁻', 'SO₄²⁻']) + g('금속', ['Zn *1', 'Cu', 'Ag', 'Na', 'Li']) + g('결정', ['NaCl', 'AgCl', 'CaCO₃']);
  }
  if (s === 0) return ['석회 동굴이 생길 때|1', '종유석과 석순이 자랄 때', '리튬 이온 전지: 충전·방전과 수명', '미토콘드리아의 ATP 합성', '뿌리털이 양분을 얻을 때'].map((x) => { const [a, c] = x.split('|'); return `<button class="row${c ? ' cur' : ''}">${a}</button>`; }).join('');
  if (s === 1) return [['건전지는 왜 충전이 안 될까', '11월 8일'], ['소금물은 왜 늦게 얼까', '11월 6일'], ['비누가 기름때를 떼어 낼 때', '11월 5일']].map(([a, d]) => `<button class="row">${a}<small>${d}</small></button>`).join('');
  return `<pre class="code">scene "석회 동굴이 생길 때"
stage interface
crowd H2O in water 18
mol c = CO2 at 330,120
mol w = H2O at 300,330

step "비가 내릴 때 공기 중의 …"
  gas-in c
step "물 분자가 CO2의 C에 …"
  approach w.O c.C
step "O의 전자쌍은 새 O–C 결합이 …"
  arrow w.O:lp -> w.O~c.C
  arrow c.C~c.O1 -> c.O1</pre>`;
}

function place() {
  const sc = SCREENS[st.tab][st.i[st.tab]], box = $('#stage').getBoundingClientRect(), d = wide();
  const iw = d ? 840 : 352, ih = d ? 600 : 452, k = Math.max(box.width / iw, box.height / ih);
  const ox = (box.width - iw * k) / 2, oy = (box.height - ih * k) / 2;
  let h = '';
  for (const [name, pos] of sc.targets || []) {
    const [x, y, r] = pos[d ? 'd' : 'p'], R = (r + 6) * k;
    const cls = sc.answer ? (name === 'Cl' ? ' on' : ' dim') : '';
    h += `<span class="tgt${cls}" data-name="${name}" style="left:${ox + x * k}px;top:${oy + y * k}px;width:${2 * R}px;height:${2 * R}px"></span>`;
  }
  if (st.term) { const [w, m, l] = TERMS[st.term]; h += `<div class="tcard"><b>${w}</b><p>${m}</p><button class="go">${l}${I('next', 18)}</button></div>`; }
  $('#over').innerHTML = h;
  $('#legend').style.display = st.term ? 'none' : '';
}

function render() {
  const t = st.tab, sc = SCREENS[t][st.i[t]], d = wide();
  $('#app').classList.toggle('open', st.open);
  $('#tabs').innerHTML = `<span class="logo">chemvis</span>` + TABS.map(([id, ic, lb]) => `<button data-tab="${id}"${id === t ? ' aria-current="page"' : ''}>${I(ic, 24)}<span>${lb}</span></button>`).join('') + `<span class="note">화면 시안</span>`;
  $('#sheet-btn').innerHTML = I(SHEET_ICON[t][0]); $('#sheet-btn').title = SHEET_ICON[t][1]; $('#sheet-btn').setAttribute('aria-label', SHEET_ICON[t][1]);
  $('#ctx').className = 'ctx' + (t === 'lab' ? ' conds' : '');
  $('#ctx').innerHTML = t === 'lab' ? ['물속', '가열', '빛'].map((c, i) => `<button class="chip sm${i === 0 ? ' on' : ''}">${c}</button>`).join('') : `${TITLE[t][0] ? `<span class="no">${TITLE[t][0]}</span>` : ''}<h1>${TITLE[t][1]}</h1>`;
  $('#count').textContent = sc.n ? `${sc.n[0]} / ${sc.n[1]}` : '';
  $('#segs').innerHTML = sc.n ? Array.from({ length: sc.n[1] }, (_, i) => `<i${i < sc.n[0] ? ' class="on"' : ''}></i>`).join('') : '';
  $('#tools').innerHTML = (t === 'ai' ? `<button class="ib" title="링크 복사" aria-label="링크 복사">${I('link')}</button>` : '') + `<button class="ib" title="보기 설정" aria-label="보기 설정">${I('sliders')}</button>`;
  $('#shot').src = `img/${sc.img}-${d ? 'd' : 'p'}.webp`;
  $('#legend').innerHTML = I('legend', 20);
  let say = '';
  if (sc.answer) {
    const ok = st.pick === 'Cl';
    say = `<div class="tagrow"><p class="tag strong">${ok ? I('check', 15) + '맞아요' : '답은 Cl이에요'}</p></div><p class="cap">Cl은 H보다 전자를 세게 당겨요. 그래서 둘을 잇던 전자쌍은 Cl로 가요.</p>`;
  } else if (sc.inv) {
    say = `<div class="toks" style="margin-top:0">${sc.inv.map(([a, n]) => `<span class="tok">${a}<small>${n}</small></span>`).join('')}</div><p class="hint" style="margin-top:10px">${sc.hint}</p>`;
  } else {
    const more = sc.more ? `<button class="more">${sc.more}${I('next', 16)}</button>` : '';
    say = (sc.tag ? `<div class="tagrow"><p class="tag">${sc.tag}</p>${more}</div>` : '') + `<p class="cap${sc.q ? ' q' : ''}">${sc.q || sc.cap}</p>` + (sc.hint ? `<p class="hint">${sc.hint}</p>` : '') +
      (sc.toks ? `<div class="toks">${sc.toks.map((x) => `<button class="tok">${x}</button>`).join('')}</div>` : '');
  }
  $('#say').innerHTML = say;
  const solo = sc.act.filter((b) => b.k !== 'primary').length === 0;
  $('#act').innerHTML = sc.act.map((b, i) => b.k === 'ib' ? `<button class="ib" data-i="${i}" title="${b.label}" aria-label="${b.label}"${b.off ? ' disabled' : ''}>${I(b.icon)}</button>`
    : `<button class="btn ${b.k}${solo ? ' solo' : ''}" data-i="${i}">${b.k === 'ghost' && b.icon ? I(b.icon, 20) : ''}<span>${b.label}</span>${b.k === 'primary' && b.icon ? I(b.icon, 20) : ''}</button>`).join('');
  $('#seg').innerHTML = SEGS[t].map((x, i) => `<button aria-pressed="${i === st.seg[t]}" data-seg="${i}">${x}</button>`).join('');
  $('#sheet-x').innerHTML = I('close');
  $('#sheet-body').innerHTML = sheetBody();
  place();
  history.replaceState(null, '', `#${t}/${st.i[t]}${st.open ? '/open' : ''}${st.seg[t] ? '/s' + st.seg[t] : ''}${st.pick ? '/p' + st.pick : ''}${st.term ? '/t' + st.term : ''}`);
}

function go(i) { st.i[st.tab] = i; st.term = null; render(); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, .stage');
  if (!el) return;
  if (el.dataset.tab) { st.tab = el.dataset.tab; st.open = false; st.term = null; return render(); }
  if (el.id === 'sheet-btn') { st.open = true; return render(); }
  if (el.id === 'sheet-x') { st.open = false; return render(); }
  if (el.dataset.seg) { st.seg[st.tab] = +el.dataset.seg; return render(); }
  if (el.dataset.term) { st.term = st.term === el.dataset.term ? null : el.dataset.term; return render(); }
  if (el.closest('#act') && el.dataset.i) {
    const b = SCREENS[st.tab][st.i[st.tab]].act[+el.dataset.i];
    if (b.sheet) { st.open = true; return render(); }
    if (b.tab) { st.tab = b.tab; return render(); }
    if (b.pick) st.pick = b.pick;
    if (b.go !== undefined && b.go !== null) return go(b.go);
    return;
  }
  if (el.id === 'stage') {
    if (st.term) { st.term = null; return render(); }
    const sc = SCREENS[st.tab][st.i[st.tab]];
    if (!sc.targets || sc.answer) return;
    let best = null, bd = 1e9;
    for (const t of document.querySelectorAll('.tgt')) { const r = t.getBoundingClientRect(); const dd = Math.hypot(e.clientX - r.x - r.width / 2, e.clientY - r.y - r.height / 2); if (dd < bd) { bd = dd; best = t.dataset.name; } }
    if (bd < 60) { st.pick = best; go(st.i[st.tab] + 1); }
  }
});
$('#scrim').addEventListener('click', () => { st.open = false; render(); });
addEventListener('resize', render);
(() => {
  const h = location.hash.slice(1).split('/');
  if (SCREENS[h[0]]) { st.tab = h[0]; st.i[st.tab] = Math.min(+h[1] || 0, SCREENS[st.tab].length - 1); }
  for (const x of h.slice(2)) { if (x === 'open') st.open = true; else if (x[0] === 's') st.seg[st.tab] = +x.slice(1); else if (x[0] === 'p') st.pick = x.slice(1); else if (x[0] === 't') st.term = x.slice(1); }
  render();
})();
</script>
</body>
</html>
